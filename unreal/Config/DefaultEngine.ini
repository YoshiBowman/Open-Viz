[/Script/EngineSettings.GameMapsSettings]
; The benchmark builds its scene in code, so an empty engine map is all it needs.
GameDefaultMap=/Engine/Maps/Entry
; The editor opens on the same empty map, so a show being edited is not sitting in a daylight landscape.
EditorStartupMap=/Engine/Maps/Entry

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
; Hardware ray tracing, which MegaLights needs. Both are experimental on macOS.
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.MegaLights.EnableForProject=True
; Fixed exposure: a rig that changes brightness must not change the image pipeline's cost.
r.DefaultFeature.AutoExposure=False

[/Script/Engine.Engine]
; Benchmarks need uncapped, unsmoothed frame times.
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/DMXProtocol.DMXProtocolSettings]
; No ports are defined here on purpose. An input port's Device Address decides which network
; interface it listens on, and the engine default of 127.0.0.1 hears only this machine.
bDefaultReceiveDMXEnabled=True
bDefaultSendDMXEnabled=False
